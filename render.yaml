services:
  - type: web
    name: veefore-api
    env: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: REDIS_URL
        fromDatabase:
          name: veefore-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
    autoDeploy: false
    
databases:
  - type: redis
    name: veefore-redis
    plan: starter
    ipAllowList: []